# Project-owned static overlay of the pinned RD-Agent model baseline.
# Upstream: rdagent/scenarios/qlib/experiment/model_template/conf_baseline_factors_model.yaml
# Upstream SHA-256: bd3e9338789f8bf4fd72e6f38032fd6a642799d0b38dc83a0ea6f043eff4248c
# SPY is a research-only structural placeholder, not the P2 certification benchmark.

qlib_init:
    provider_uri: /mnt/d/AQ_DATA/P2/qlib-native-ragged-panel-001/qlib_data
    region: us
    exp_manager:
        class: MLflowExpManager
        module_path: qlib.workflow.expm
        kwargs:
            uri: sqlite:////mnt/d/AQ_DATA/P3/rdagent-us-ragged/mlflow.db
            default_exp_name: Experiment

market: &market p2_pit
benchmark: &benchmark SPY

data_handler_config: &data_handler_config
    start_time: 2015-01-02
    end_time: 2024-12-31
    instruments: *market
    data_loader:
        class: NestedDataLoader
        kwargs:
            dataloader_l:
                - class: qlib.contrib.data.loader.Alpha158DL
                  kwargs:
                    config:
                        label:
                            - ["Ref($close, -2)/Ref($close, -1) - 1"]
                            - ["LABEL0"]
                        feature:
                            - {{ feature_expressions }}
                            - {{ feature_names }}

    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: 2015-01-02
              fit_end_time: 2019-12-31
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2022-01-03
        end_time: 2024-12-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: GeneralPTNN
        module_path: qlib.contrib.model.pytorch_general_nn
        kwargs:
            n_epochs: {{ n_epochs }}
            lr: {{ lr }}
            early_stop: {{ early_stop }}
            batch_size: {{ batch_size }}
            weight_decay: {{ weight_decay }}
            metric: loss
            loss: mse
            n_jobs: 20
            GPU: 0
            pt_model_uri: model.model_cls
            pt_model_kwargs:
                num_features: 20
                {% if num_timesteps %}num_timesteps: {{ num_timesteps }}{% endif %}
    dataset:
        class: {{ dataset_cls | default("DatasetH") }}
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2015-01-02, 2019-12-31]
                valid: [2020-01-02, 2021-12-31]
                test: [2022-01-03, 2024-12-31]
            {% if step_len %}step_len: {{ step_len }}{% endif %}
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: false
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
