qlib_init:
  provider_uri: "/home/zhou/AQ_DATA/P1/qlib-native-baseline-001/qlib_data"
  region: us
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: "sqlite:////home/zhou/AQ_DATA/P1/qlib-native-model-comparison-001/linear-run/mlflow.db"
      default_exp_name: Experiment

experiment_name: aq_p1_qlib_model_compare_linear_001

market: &market sp500
benchmark: &benchmark SPY

data_handler_config: &data_handler_config
  start_time: 2015-01-02
  end_time: 2025-12-31
  fit_start_time: 2015-04-01
  fit_end_time: 2019-12-31
  instruments: *market
  infer_processors:
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
    - class: Fillna
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs:
        fields_group: label

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: 2022-01-03
    end_time: 2025-12-29
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

task:
  model:
    class: LinearModel
    module_path: qlib.contrib.model.linear
    kwargs:
      estimator: ols
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train: [2015-04-01, 2019-12-31]
        valid: [2020-01-01, 2021-12-31]
        test: [2022-01-03, 2025-12-29]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: true
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config


