stages:
  p2_certification_historical_rehearsal:
    cmd: >-
      python -B 40-certification-system/historical-rehearsal/seal_rehearsal.py
      --protocol 40-certification-system/protocol/p2-certification-protocol-v1.json
      --activation 40-certification-system/protocol/p2-certification-protocol-v1-activation.json
      --provider-report D:/AQ_DATA/P2/qlib-native-ragged-panel-001/reports/build-report.json
      --primary-pred D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/primary_pred.pkl
      --control-pred D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/control_pred.pkl
      --mlflow-db D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/mlflow/mlflow.db
      --blocker D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/qlib-rehearsal-blocker.json
      --historical-summary D:/AQ_DATA/P2/certification-historical-rehearsal-001/reports/rehearsal-summary.json
      --runtime-day D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib-calendar-runtime/calendars/day.txt
      --runtime-future D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib-calendar-runtime/calendars/day_future.txt
      --qlib-report D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/qlib-rehearsal-report.json
      --daily-returns D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/daily_net_returns.csv
      --skfolio-report D:/AQ_DATA/P2/certification-historical-rehearsal-001/skfolio/skfolio-report.json
      --arch-report D:/AQ_DATA/P2/certification-historical-rehearsal-001/arch/arch-report.json
      --validation-report D:/AQ_DATA/P2/certification-historical-rehearsal-001/validation/validation-report.json
      --final-summary D:/AQ_DATA/P2/certification-historical-rehearsal-001/reports/rehearsal-summary-resolved.json
      --output 40-certification-system/historical-rehearsal/.private/dvc-seal.json
    deps:
      - 40-certification-system/historical-rehearsal/seal_rehearsal.py
      - 40-certification-system/protocol/p2-certification-protocol-v1.json
      - 40-certification-system/protocol/p2-certification-protocol-v1-activation.json
      - D:/AQ_DATA/P2/qlib-native-ragged-panel-001/reports/build-report.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/primary_pred.pkl
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/control_pred.pkl
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/mlflow/mlflow.db
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/qlib-rehearsal-blocker.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/reports/rehearsal-summary.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib-calendar-runtime/calendars/day.txt
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib-calendar-runtime/calendars/day_future.txt
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/qlib-rehearsal-report.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/qlib/daily_net_returns.csv
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/skfolio/skfolio-report.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/arch/arch-report.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/validation/validation-report.json
      - D:/AQ_DATA/P2/certification-historical-rehearsal-001/reports/rehearsal-summary-resolved.json
    outs:
      - 40-certification-system/historical-rehearsal/.private/dvc-seal.json
  p2_certification_protocol_freeze:
    cmd: >-
      python -B 40-certification-system/protocol/seal_protocol.py
      --protocol 40-certification-system/protocol/p2-certification-protocol-v1.json
      --provider-report D:/AQ_DATA/P2/qlib-native-ragged-panel-001/reports/build-report.json
      --qlib-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/qlib/qlib-mlflow-report.json
      --skfolio-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/skfolio/skfolio-report.json
      --arch-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/arch/arch-report.json
      --validation-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/validation/validation-report.json
      --blocker-ledger 40-certification-system/upstream-stack-integration/blockers.json
      --authority-facts 10-data-system/market-data/provider-binding-authority/accepted_provider_binding_facts.json
      --ragged-alpha-config 30-research-system/qlib/dataset-adapter/aq_qlib_handoff/qlib_config.py
      --primary-model-config 30-research-system/qlib/native-baseline/workflow_config_lightgbm_Alpha158_US.yaml
      --control-model-config 30-research-system/qlib/model-comparison/workflow_config_linear_Alpha158_US.yaml
      --strategy-config 30-research-system/qlib/strategy-comparison/strategy_candidates_Alpha158_US.yaml
      --output 40-certification-system/protocol/.private/protocol-freeze-seal.json
    deps:
      - 40-certification-system/protocol/seal_protocol.py
      - 40-certification-system/protocol/p2-certification-protocol-v1.json
      - D:/AQ_DATA/P2/qlib-native-ragged-panel-001/reports/build-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/qlib/qlib-mlflow-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/skfolio/skfolio-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/arch/arch-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/validation/validation-report.json
      - 40-certification-system/upstream-stack-integration/blockers.json
      - 10-data-system/market-data/provider-binding-authority/accepted_provider_binding_facts.json
      - 30-research-system/qlib/dataset-adapter/aq_qlib_handoff/qlib_config.py
      - 30-research-system/qlib/native-baseline/workflow_config_lightgbm_Alpha158_US.yaml
      - 30-research-system/qlib/model-comparison/workflow_config_linear_Alpha158_US.yaml
      - 30-research-system/qlib/strategy-comparison/strategy_candidates_Alpha158_US.yaml
    outs:
      - 40-certification-system/protocol/.private/protocol-freeze-seal.json
  p2_upstream_certification_stack_integration:
    cmd: >-
      python -B 40-certification-system/upstream-stack-integration/seal_evidence.py
      --provider-report D:/AQ_DATA/P2/qlib-native-ragged-panel-001/reports/build-report.json
      --qlib-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/qlib/qlib-mlflow-report.json
      --skfolio-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/skfolio/skfolio-report.json
      --arch-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/arch/arch-report.json
      --validation-report D:/AQ_DATA/P2/upstream-certification-stack-integration-001/validation/validation-report.json
      --blocker-ledger 40-certification-system/upstream-stack-integration/blockers.json
      --output 40-certification-system/upstream-stack-integration/.private/dvc-seal.json
    deps:
      - 40-certification-system/upstream-stack-integration/seal_evidence.py
      - 40-certification-system/upstream-stack-integration/blockers.json
      - D:/AQ_DATA/P2/qlib-native-ragged-panel-001/reports/build-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/qlib/qlib-mlflow-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/skfolio/skfolio-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/arch/arch-report.json
      - D:/AQ_DATA/P2/upstream-certification-stack-integration-001/validation/validation-report.json
    outs:
      - 40-certification-system/upstream-stack-integration/.private/dvc-seal.json
  pit_universe_snapshot:
    cmd: >-
      uv run --no-project --python 3.12
      --with-requirements 10-data-system/universe/sp500-pit/aq_pit/schema/pandera/requirements.txt
      python -B 10-data-system/dataset-snapshot/pit-universe/export_snapshot.py
      --data-root D:/AQ_DATA/P1/pit
      --output 10-data-system/dataset-snapshot/pit-universe/data
    deps:
      - 10-data-system/dataset-snapshot/pit-universe/aq_dataset_snapshot
      - 10-data-system/dataset-snapshot/pit-universe/export_snapshot.py
      - 10-data-system/universe/sp500-pit/aq_pit/adapters
      - 10-data-system/universe/sp500-pit/aq_pit/canonical.py
      - 10-data-system/universe/sp500-pit/aq_pit/domain
      - 10-data-system/universe/sp500-pit/aq_pit/export
      - 10-data-system/universe/sp500-pit/aq_pit/facts/accepted.py
      - 10-data-system/universe/sp500-pit/aq_pit/facts/accepted_reconciliation_facts.json
      - 10-data-system/universe/sp500-pit/aq_pit/gates
      - 10-data-system/universe/sp500-pit/aq_pit/schema/pandera
      - 10-data-system/universe/sp500-pit/aq_pit/thin_runtime.py
      - D:/AQ_DATA/P1/pit/raw/fja_sp500/repo/S&P 500 Historical Components & Changes (Updated).csv
    outs:
      - 10-data-system/dataset-snapshot/pit-universe/data
