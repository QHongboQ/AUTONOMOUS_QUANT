model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: openai/mock-chat
      api_base: http://mock:8000/v1
      api_key: test-local-only
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: openai/mock-embedding
      api_base: http://mock:8000/v1
      api_key: test-local-only
    model_info:
      mode: embedding
      input_cost_per_token: 0.000001
      output_cost_per_token: 0
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_budget_reservation: false
  fail_closed_budget_enforcement: true
  allow_client_side_credentials: false
litellm_settings:
  block_requests_for_models_without_pricing: true
router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  enable_pre_call_checks: true
  num_retries: 0
