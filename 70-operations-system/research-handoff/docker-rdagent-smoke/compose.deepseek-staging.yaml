services:
  litellm-deepseek-staging:
    image: ghcr.io/berriai/litellm@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    pull_policy: never
    profiles: [deepseek-staging]
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        test -s /run/secrets/deepseek_api_key;
        export DEEPSEEK_API_KEY="$$(cat /run/secrets/deepseek_api_key)";
        test -n "$$DEEPSEEK_API_KEY";
        exec litellm --config /app/config.deepseek-staging.yaml --port 4000 --num_workers 1
    environment:
      LITELLM_DEEPSEEK_STAGING_MASTER_KEY: ${LITELLM_DEEPSEEK_STAGING_MASTER_KEY:?separate staging Proxy admin key required}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?dedicated TEST_ONLY database password required}@postgres:5432/litellm_deepseek_staging
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      P12_OLLAMA_API_BASE: ${P12_OLLAMA_API_BASE:?reachable existing Ollama URL required}
    secrets:
      - deepseek_api_key
    volumes:
      - ./config.deepseek-staging.yaml:/app/config.deepseek-staging.yaml:ro
      - ./native_experiment_budget.py:/app/native_experiment_budget.py:ro
      - ./owner_oneshot_proxy_control.py:/app/owner_oneshot_proxy_control.py:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 40
    networks: [core, worker_proxy, provider_egress]

  rdagent-owner-oneshot-worker:
    image: aq/p3-rdagent-qlib:rdagent-1.0.0-qlib-0.9.8.dev26-v1
    pull_policy: never
    profiles: [p12-owner-oneshot]
    environment:
      P12_OWNER_SCOPED_PROXY_KEY: ${P12_OWNER_SCOPED_PROXY_KEY:-}
      OPENAI_API_KEY: ${P12_OWNER_SCOPED_PROXY_KEY:-}
      OPENAI_API_BASE: http://litellm-deepseek-staging:4000/v1
      BACKEND: rdagent.oai.backend.LiteLLMAPIBackend
      LITELLM_CHAT_MODEL: openai/deepseek/deepseek-flash
      LITELLM_EMBEDDING_MODEL: openai/ollama/qwen3-embedding:0.6b
      LITELLM_CHAT_MAX_TOKENS: "8192"
      LITELLM_CHAT_MODEL_MAP: "{}"
      LITELLM_CHAT_STREAM: "false"
      LITELLM_LOG_LLM_CHAT_CONTENT: "false"
      LITELLM_REASONING_EFFORT: high
      MODEL_COSTEER_ENV_TYPE: conda
      FACTOR_COSTEER_PYTHON_BIN: /opt/conda/envs/rdagent4qlib/bin/python
      FACTOR_COSTEER_DATA_FOLDER: /data/factor-source/full
      FACTOR_COSTEER_DATA_FOLDER_DEBUG: /data/factor-source/debug
      QLIB_QUANT_FACTOR_HYPOTHESIS2EXPERIMENT: aq_rdagent_official_us_binding.USQlibFactorHypothesis2Experiment
      QLIB_QUANT_MODEL_HYPOTHESIS2EXPERIMENT: aq_rdagent_official_us_binding.USQlibModelHypothesis2Experiment
      QLIB_QUANT_TRAIN_START: "2015-01-02"
      QLIB_QUANT_TRAIN_END: "2019-12-31"
      QLIB_QUANT_VALID_START: "2020-01-02"
      QLIB_QUANT_VALID_END: "2021-12-31"
      QLIB_QUANT_TEST_START: "2022-01-03"
      QLIB_QUANT_TEST_END: "2024-12-31"
      QLIB_FACTOR_TRAIN_START: "2015-01-02"
      QLIB_FACTOR_TRAIN_END: "2019-12-31"
      QLIB_FACTOR_VALID_START: "2020-01-02"
      QLIB_FACTOR_VALID_END: "2021-12-31"
      QLIB_FACTOR_TEST_START: "2022-01-03"
      QLIB_FACTOR_TEST_END: "2024-12-31"
      QLIB_MODEL_TRAIN_START: "2015-01-02"
      QLIB_MODEL_TRAIN_END: "2019-12-31"
      QLIB_MODEL_VALID_START: "2020-01-02"
      QLIB_MODEL_VALID_END: "2021-12-31"
      QLIB_MODEL_TEST_START: "2022-01-03"
      QLIB_MODEL_TEST_END: "2024-12-31"
      P12_RUN_NAMESPACE: ${P12_RUN_NAMESPACE:-}
      P12_FINQUANT_OUTPUT_DIR: ${P12_FINQUANT_OUTPUT_DIR:-}
      WORKSPACE_PATH: /workspace/runs/${P12_RUN_NAMESPACE:-}/workspaces
      PICKLE_CACHE_FOLDER_PATH_STR: /workspace/runs/${P12_RUN_NAMESPACE:-}/pickle-cache
      LOG_TRACE_PATH: /workspace/runs/${P12_RUN_NAMESPACE:-}/trace
      QLIB_MLFLOW_URI: sqlite:////workspace/runs/${P12_RUN_NAMESPACE:-}/mlflow.db
      HOME: /home/rdagent
      TMPDIR: /tmp
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${P12_OWNER_SCOPED_PROXY_KEY}" in
          sk-*) case "$${P12_OWNER_SCOPED_PROXY_KEY}" in sk-test-*|*placeholder*|*not-yet-provisioned*) echo 'owner-scoped paid Proxy key required' >&2; exit 64;; esac;;
          *) echo 'owner-scoped paid Proxy key required' >&2; exit 64;;
        esac
        test "$${OPENAI_API_KEY}" = "$${P12_OWNER_SCOPED_PROXY_KEY}"
        test "$${LITELLM_CHAT_MAX_TOKENS}" = 8192
        test "$${LITELLM_CHAT_MODEL_MAP}" = '{}'
        case "$${P12_RUN_NAMESPACE}" in aq-p12-owner-????????????) ;; *) echo 'one-shot run namespace required' >&2; exit 64;; esac
        case "$${P12_FINQUANT_OUTPUT_DIR}" in /mnt/d/AQ/OPERATIONS/P12/finquant-output/*/*) ;; *) echo 'durable per-attempt output path required' >&2; exit 64;; esac
        test -f /workspace/p12-attempt.json
        exec rdagent "$@"
      - --
    command: ["fin_quant", "--loop-n", "1"]
    volumes:
      - type: bind
        source: ${P12_FINQUANT_OUTPUT_DIR:-/tmp/p12-worker-disabled}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/d/AQ_DATA/P3/rdagent-us-ragged/factor-source
        target: /data/factor-source
        read_only: true
      - type: bind
        source: /mnt/d/AQ_DATA/P2/qlib-native-ragged-panel-001/qlib_data
        target: /mnt/d/AQ_DATA/P2/qlib-native-ragged-panel-001/qlib_data
        read_only: true
      - type: bind
        source: /mnt/d/AQ_DATA/P2/certification-historical-rehearsal-001/qlib-calendar-runtime
        target: /mnt/d/AQ_DATA/P2/certification-historical-rehearsal-001/qlib-calendar-runtime
        read_only: true
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,uid=10001,gid=10001
      - /home/rdagent:rw,nosuid,nodev,size=256m,uid=10001,gid=10001
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    init: true
    depends_on:
      litellm-deepseek-staging: {condition: service_healthy}
    networks: [worker_proxy]

secrets:
  deepseek_api_key:
    file: ${P12_DEEPSEEK_API_KEY_FILE:?owner-managed provider secret file required}

networks:
  worker_proxy:
    name: aq-p12-litellm-worker-proxy
  provider_egress:
    driver: bridge
    internal: false
    name: aq-p12-deepseek-provider-egress
